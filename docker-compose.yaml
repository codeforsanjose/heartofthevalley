services:
  frontend:
    build:
      context: app/frontend
    environment:
      - NODE_ENV=development
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: >
      bun dev

  backend:
    build:
      context: app/backend
    # environment:
    #   API_BASE_URL: "/v1/heartofvalley"
    volumes:
      - ./app/backend:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    # healthcheck:
    #   test: curl localhost:3001/v1/heartofvalley/ping
    #   interval: 10s
    #   timeout: 15s
    command: >
      sh -c "cd dev-server && air ."
