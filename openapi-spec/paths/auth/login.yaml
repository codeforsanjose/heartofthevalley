post:
  summary: User login
  description: Authenticate a user with email and password
  tags:
    - auth
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
              format: email
              description: User email address
            password:
              type: string
              format: password
              description: User password
          required:
            - email
            - password
  responses:
    '200':
      description: Login successful
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
                description: Authentication token
              user:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
    '401':
      description: Invalid credentials
    '400':
      description: Bad request