post:
  summary: Request image upload URL from S3
  description: Generate a presigned URL for uploading an image to S3
  operationId: requestImageUploadUrl
  responses:
    "200":
      description: Presigned S3 upload URL generated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              uploadUrl:
                type: string
                description: Presigned S3 URL for uploading the image
              imageKey:
                type: string
                description: S3 object key where the image will be stored
            required:
              - uploadUrl
              - imageKey
    "500":
      description: Server error
